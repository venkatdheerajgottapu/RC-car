{% extends "admin/admin_layout.html" %}

{% block title %}Admin Profile | TERRAIN X-TREME RC{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 600px;">
    <div style="text-align: center; margin-bottom: 24px;">
        <span style="font-family: var(--font-subheading); font-size: 11px; font-weight: 800; color: var(--primary-orange); letter-spacing: 2px;">ACCOUNT SETTINGS</span>
        <h2>ADMIN PROFILE</h2>
        <p style="color: var(--text-muted); font-size: 13px;">Manage your administrator profile details & password</p>
    </div>

    <div style="display: flex; justify-content: center; margin-bottom: 24px;">
        {% if admin.profile_image %}
            <img src="{{ url_for('static', filename='uploads/admin_images/' + admin.profile_image) }}" alt="Admin Profile Photo" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-orange); box-shadow: var(--box-shadow-orange);">
        {% else %}
            <div style="width: 100px; height: 100px; border-radius: 50%; background-color: var(--bg-dark-main); border: 2px solid var(--border-dark); display: flex; align-items: center; justify-content: center; color: var(--primary-orange);">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        {% endif %}
    </div>

    <form method="POST" action="/admin/profile" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Admin Full Name</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ admin.name }}" required>
        </div>

        <div class="form-group">
            <label for="email">Admin Email</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ admin.email }}" required>
        </div>

        <div class="form-group">
            <label for="password">New Password (leave blank to keep current)</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••">
        </div>

        <div class="form-group">
            <label for="profile_image">Upload New Profile Avatar (Optional)</label>
            <input type="file" id="profile_image" name="profile_image" class="form-control" accept="image/*" style="padding: 10px;">
        </div>

        <div style="display: flex; gap: 12px; margin-top: 28px;">
            <button type="submit" class="btn-submit" style="flex: 2;">Update Profile</button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn-action-secondary" style="flex: 1; text-align: center; justify-content: center;">Back</a>
        </div>
    </form>
</div>
{% endblock %}
