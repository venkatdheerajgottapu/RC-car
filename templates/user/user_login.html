{% extends "layout.html" %}

{% block title %}User Sign In | TERRAIN X-TREME RC{% endblock %}

{% block content %}
<div class="form-card">
    <div style="text-align: center; margin-bottom: 24px;">
        <div class="brand-icon" style="margin: 0 auto 12px; width: 50px; height: 50px;">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
        <h2>DRIVER LOGIN</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Sign in to access your orders, saved cart, and member perks.</p>
    </div>

    <form method="POST" action="/user-login">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="driver@example.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">LOG IN NOW &rarr;</button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
        Don't have an account? <a href="/user-register" style="color: var(--primary-orange); font-weight: 700;">Create Account</a>
    </div>
</div>
{% endblock %}
