{% extends "layout.html" %}

{% block title %}Shipping Address | TERRAIN X-TREME RC{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 650px;">
    <div style="text-align: center; margin-bottom: 24px;">
        <div class="brand-icon" style="margin: 0 auto 12px; width: 50px; height: 50px;">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
        </div>
        <h2>DELIVERY ADDRESS</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Where should we dispatch your RC gear?</p>
    </div>

    <form method="POST" action="/save-address">
        <div class="form-group">
            <label>Full Recipient Name</label>
            <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" class="form-control" placeholder="+91 9876543210" required>
            </div>
            <div class="form-group">
                <label>Pincode / Postal Code</label>
                <input type="text" name="pincode" class="form-control" placeholder="500001" required>
            </div>
        </div>

        <div class="form-group">
            <label>Street Address / House No.</label>
            <textarea name="address" class="form-control" rows="3" placeholder="Flat No 402, Off-Road Avenue, Racing Colony..." required></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label>City</label>
                <input type="text" name="city" class="form-control" placeholder="Hyderabad" required>
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" name="state" class="form-control" placeholder="Telangana" required>
            </div>
            <div class="form-group">
                <label>Country</label>
                <input type="text" name="country" class="form-control" value="India" required>
            </div>
        </div>

        <button type="submit" class="btn-submit">SAVE ADDRESS & PROCEED TO PAYMENT &rarr;</button>
    </form>
</div>
{% endblock %}
