<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartCart - Delivery Address</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
        }

        @media (max-width: 600px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Delivery Address</h1>

        <p class="subtitle">
            Enter your delivery details
        </p>

        <form action="/save-address" method="POST">

            <div class="form-group">
                <label for="full_name">Full Name</label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    pattern="[0-9]{10}"
                    required
                >
            </div>


            <div class="form-group">
                <label for="address">Address</label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="House No, Street, Area"
                    required
                ></textarea>
            </div>


            <div class="row">

                <div class="form-group">
                    <label for="city">City</label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="City"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="state">State</label>

                    <input
                        type="text"
                        id="state"
                        name="state"
                        placeholder="State"
                        required
                    >
                </div>

            </div>


            <div class="row">

                <div class="form-group">
                    <label for="pincode">PIN Code</label>

                    <input
                        type="text"
                        id="pincode"
                        name="pincode"
                        placeholder="PIN Code"
                        pattern="[0-9]{6}"
                        required
                    >
                </div>


                <div class="form-group">

                    <label for="country">Country</label>

                    <select id="country" name="country" required>

                        <option value="">Select Country</option>

                        <option value="India">
                            India
                        </option>

                    </select>

                </div>

            </div>
            <button type="submit" class="btn">Save Address & Proceed to Payment</button>
        </form>


        <a href="/user-dashboard" class="back">
            ← Back to Dashboard
        </a>

    </div>
    

</body>
</html>
