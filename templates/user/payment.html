{% extends "layout.html" %}

{% block title %}Checkout Payment | TERRAIN X-TREME RC{% endblock %}

{% block content %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<div class="form-card" style="text-align: center; max-width: 550px;">
    <div class="brand-icon" style="margin: 0 auto 16px; width: 60px; height: 60px;">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
        </svg>
    </div>

    <h2 style="font-family: var(--font-heading); font-size: 36px; color: white;">SECURE CHECKOUT</h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">Your order is ready for payment confirmation.</p>

    <div style="background: var(--bg-dark-main); border: 1px solid var(--border-dark); border-radius: 8px; padding: 20px; margin-bottom: 28px;">
        <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 4px;">TOTAL ORDER AMOUNT</div>
        <div style="font-family: var(--font-subheading); font-size: 38px; font-weight: 800; color: var(--primary-orange);">
            ₹{{ "%.2f"|format(amount) }}
        </div>
        <div style="font-size: 12px; color: #28a745; font-weight: 600; margin-top: 4px;">&#10003; 256-Bit SSL Encrypted & Secured</div>
    </div>

    <button type="button" id="rzp-button" class="btn-submit" style="font-size: 16px; padding: 14px;">
        PAY NOW WITH RAZORPAY &rarr;
    </button>
</div>

<script>
    var options = {
        "key": "{{ key_id }}",
        "amount": "{{ amount * 100 }}",
        "currency": "INR",
        "name": "TERRAIN X-TREME RC",
        "description": "RC Parts & Vehicle Order Payment",
        "order_id": "{{ order_id }}",
        "handler": function (response) {
            var form = document.createElement("form");
            form.method = "POST";
            form.action = "/verify-payment"; 

            var fields = {
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_order_id: response.razorpay_order_id,
                razorpay_signature: response.razorpay_signature
            };

            for (var name in fields) {
                var input = document.createElement("input");
                input.type = "hidden";
                input.name = name;
                input.value = fields[name];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
        },
        "prefill": {
            "name": "{{ user_name | default('') }}",
            "email": "{{ user_email | default('') }}"
        },
        "theme": {
            "color": "#ff5500"
        }
    };

    var rzp = new Razorpay(options);
    document.getElementById("rzp-button").onclick = function(e) {
        rzp.open();
        e.preventDefault();
    };
</script>
{% endblock %}
